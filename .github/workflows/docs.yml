name: Docs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"   # weekly: catch pages that went stale with no commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Front matter
        run: python tools/check_frontmatter.py
      - name: Freshness
        run: python tools/check_freshness.py
      - name: Internal links
        run: python tools/check_links.py
      - name: Terminology
        run: python tools/check_terms.py
      - name: llms.txt is current
        run: python tools/build_llms_txt.py --check
      - name: Retrieval eval
        run: python tools/eval_retrieval.py
      - name: Prose lint (Vale)
        uses: errata-ai/vale-action@v2
        with:
          files: docs
          fail_on_error: true
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
